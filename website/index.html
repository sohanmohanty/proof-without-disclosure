<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Proof Without Disclosure: an interactive cryptography lab about trust, privacy, and verification. Hash functions, commitments, Merkle proofs, signatures, and zero-knowledge, all running in your browser."
    />
    <title>Proof Without Disclosure</title>
    <script>
      // apply the theme before first paint to avoid a flash:
      // dark by default, unless the visitor explicitly chose light
      if (localStorage.getItem("pwd-theme") !== "light") {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
