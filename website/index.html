<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proof Without Disclosure | Interactive Cryptography Lab</title>
    <meta
      name="description"
      content="Learn how cryptography proves things without revealing secrets. Interactive labs for hashes, commitments, Merkle trees, signatures, and zero-knowledge proofs."
    />
    <link rel="canonical" href="https://proofwithoutdisclosure.com/" />
    <meta name="theme-color" content="#16151a" />

    <!-- icons: Google's search-result icon needs a square, 48px-multiple favicon -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- link previews (Open Graph / Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Proof Without Disclosure" />
    <meta property="og:title" content="Proof Without Disclosure | Interactive Cryptography Lab" />
    <meta
      property="og:description"
      content="Learn how cryptography proves things without revealing secrets. Interactive labs for hashes, commitments, Merkle trees, signatures, and zero-knowledge proofs."
    />
    <meta property="og:url" content="https://proofwithoutdisclosure.com/" />
    <meta property="og:image" content="https://proofwithoutdisclosure.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Proof Without Disclosure logo: a ring around a dot" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- site name shown above the search result -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Proof Without Disclosure",
        "url": "https://proofwithoutdisclosure.com/"
      }
    </script>
    <script>
      // apply the theme before first paint to avoid a flash:
      // dark by default, unless the visitor explicitly chose light
      if (localStorage.getItem("pwd-theme") !== "light") {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
